name: Deploy → Banahosting

on:
  workflow_dispatch:
    inputs:
      deploy_runtime_data:
        description: 'Subir tambien crm/data, crm-care-comfort/data y ventas/data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'guia.html'
      - 'CNAME'
      - 'assets/**'
      - 'ventas/**'
      - 'crm/**'
      - 'crm-care-comfort/**'
      - 'clubmimascota/**'
      - 'videos.html'
      - 'videos/**'
      - '.github/workflows/deploy-banahosting.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Preparar versión principal
        env:
          DEPLOY_RUNTIME_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_runtime_data == 'true' }}
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp guia.html public/guia.html
          if [ -d assets ]; then cp -R assets public/; fi
          if [ -d ventas ]; then cp -R ventas public/; fi
          if [ -d crm ]; then cp -R crm public/; fi
          if [ -d crm-care-comfort ]; then cp -R crm-care-comfort public/; fi
          if [ -d clubmimascota ]; then cp -R clubmimascota public/; fi
          if [ -f videos.html ]; then cp videos.html public/videos.html; fi
          if [ -f videos/index.html ]; then mkdir -p public/videos && cp videos/index.html public/videos/index.html; fi
          if [ -d videos/media ]; then mkdir -p public/videos && cp -R videos/media public/videos/; fi
          if [ "$DEPLOY_RUNTIME_DATA" != "true" ]; then
            rm -rf public/ventas/data public/crm/data public/crm-care-comfort/data
          fi

      - name: Deploy petvitalityhub.com (versión completa)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./public/
          security: loose
          log-level: standard
